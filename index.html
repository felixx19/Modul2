                transform: translate3d(-100px, -100px, 0);

            }

            .custom-cursor-art {
                position: absolute;
                inset: 0;
                transform-origin: 2px 1px;
                animation: cursor-idle-bob 1.5s ease-in-out infinite;
                will-change: transform;
            }

                display: block;

                filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 3px rgba(0, 255, 102, 0.5));

                border-radius: 50%;

            45% { transform: perspective(120px) rotateX(30deg) scale(0.76); }
            100% { transform: perspective(120px) rotateX(0) scale(1); }

        @keyframes cursor-click-ripple {

            box-shadow: 0 12px 24px rgba(0, 240, 255, 0.12), 0 0 18px rgba(0, 255, 102, 0.08);

        .download-link {
            position: relative;
            z-index: 0;
            display: block;
            padding: 2px;
            border-radius: 6px;
            isolation: isolate;
        }
        @property --download-rgb-angle {
            syntax: "<angle>";
            inherits: false;
            initial-value: 0deg;
        }
        .download-link::before {
            position: absolute;
            z-index: 1;
            inset: 0;
            padding: 2px;
            border-radius: inherit;
            background: conic-gradient(
                from var(--download-rgb-angle),
                #ff1744 0deg 45deg,
                #ffea00 45deg 90deg,
                #00ff66 90deg 135deg,
                #00f0ff 135deg 180deg,
                #7c4dff 180deg 225deg,
                #ff1744 225deg 270deg,
                #ffea00 270deg 315deg,
                #00f0ff 315deg 360deg
            );
            content: "";
            opacity: 0;
            filter:
                drop-shadow(0 0 3px #ff1744)
                drop-shadow(0 0 6px #00ff66)
                drop-shadow(0 0 12px #00f0ff);
            transition: opacity 180ms ease;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
        }
        .download-link:hover::before, .download-link:focus-visible::before {
            opacity: 1;
            animation: download-rgb-running 1.4s linear infinite;
        }
        .download-link-face {
            position: relative;
            z-index: 2;
            display: block;
            border-radius: 4px;
            background: #00ff66;
            padding: 8px 10px;
            color: #000;
            text-align: center;
            transition: background-color 180ms ease;
        }
        .download-link:hover .download-link-face,
        .download-link:focus-visible .download-link-face {
            background: #101318;
            color: #fff;
        }
        @keyframes download-rgb-running {
            to { --download-rgb-angle: 360deg; }
        }

        const welcomeWordScrambleDuration = 7;

        const scrambleWelcomeWord = (word) => word.replace(/[A-Za-z0-9]/g, () =>
            welcomeScrambleCharacters[Math.floor(Math.random() * welcomeScrambleCharacters.length)]
        );

        const materialFiles = {

        };

        const terminalOutput = [
            { text: "Website ini dibuat semalaman suntuk pada bagian Front End O,,O ." },
            { text: "Website mengandung tema : Terminal/Command Prompt, Dark Green ala-ala Hacker :v", prefix: true },
            { text: "", spacer: true },
            { text: "Styling menggunakan CSS Tailwind via CDN dan Script React Js", prefix: true },
            { text: "", spacer: true },
            { text: "Di dalam Web ini terdapat :", prefix: true },
            { text: "Penjelasan Singkat", prefix: true, nested: true },
            { text: "Source Code", prefix: true, nested: true },
            { text: "Simulasi Tampilan Output", prefix: true, nested: true },
            { text: "Materi lengkap dari Pertemuan 1 - Pertemuan 21", prefix: true, nested: true }
        ];
        const terminalCompleteProgress = 4 + terminalOutput.length * 5;

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [welcomeMessage] = useState(() => welcomeMessages[Math.floor(Math.random() * welcomeMessages.length)]);
            const [welcomeProgress, setWelcomeProgress] = useState(0);
            const [copiedIndex, setCopiedIndex] = useState(null);
            const [simInput, setSimInput] = useState({ name: '', jsName: '', stringText: 'Herlian Dwi Prianka', score: '88', choice: 'Jakarta' });
            const [simResult, setSimResult] = useState({});
            const [currentTime, setCurrentTime] = useState(new Date());
            const [viewportWidth, setViewportWidth] = useState(window.innerWidth);
            const [marqueeSpeed, setMarqueeSpeed] = useState(5);
            const [terminalProgress, setTerminalProgress] = useState(0);
            const renderTerminalLine = (line, index) => (
                <p
                    key={index}
                    className={`${line.prefix ? 'text-cyan-300' : ''} ${line.nested ? 'pl-8' : line.prefix ? 'pl-4' : ''} break-words`}
                >
                    {line.prefix && '-> '}{line.text || '\u00a0'}
                </p>
            );

            useEffect(() => {
                const wordCount = welcomeMessage.split(' ').length;
                const completeProgress = (wordCount - 1) * welcomeWordStagger + welcomeWordScrambleDuration;
                let progress = 0;
                const timer = setInterval(() => {
                    progress += 1;
                    setWelcomeProgress(progress);
                    if (progress >= completeProgress) clearInterval(timer);
                }, 65);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const updateViewportWidth = () => setViewportWidth(window.innerWidth);
                window.addEventListener('resize', updateViewportWidth);
                return () => window.removeEventListener('resize', updateViewportWidth);
            }, []);

            useEffect(() => {
                let progress = 0;
                const timer = setInterval(() => {
                    progress += 1;
                    setTerminalProgress(progress);
                    if (progress >= terminalCompleteProgress) clearInterval(timer);
                }, 80);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if (activeTab !== 'materials') return;

                const elements = document.querySelectorAll('[data-scroll-reveal]');
                if (!('IntersectionObserver' in window)) {
                    elements.forEach((element) => element.classList.add('is-visible'));
                    return;
                }

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (!entry.isIntersecting) return;
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    });
                }, { threshold: 0.08 });

                elements.forEach((element) => observer.observe(element));
                return () => observer.disconnect();
            }, [activeTab]);

            // Rangkuman Materi dari Pertemuan 1 - 21
            const materialGroups = [
                {
                    group: "Pertemuan 1 - 5: Konsep Dasar, HTML, PHP Dasar & Operator",
                    items: [
                        {
                            id: 1,

                            desc: "Mempelajari pengertian website (statis, dinamis, interaktif), istilah dasar internet, WWW, web server (Apache/XAMPP), URL, DNS, protokol HTTP, serta struktur navigasi (Linier, Hirarki, Non-Linier, Campuran).",

                            simulationType: "html"
                        },
                        {

                            desc: "Mengenal struktur dasar dokumen HTML (<HTML>, <HEAD>, <TITLE>, <BODY>), penggunaan berbagai format tag teks, heading, paragraf, pembuatan tabel dengan <tr>, <td>, <th>, serta pengaturan rowspwebsite (statis, dinamis, interaktif), istilah dasar internet, WWW, web server (Apache/XAMPP), URL, DNS, protokol HTTP, serta struktur navigasi (Linier, Hirarki, Non-Linier, Campuran).",
                            code: `<!-- Contoh Struktur Navigasi Hirarki Konseptual -->\n<div class="master-page">\n  <h1>Menu Utama</h1>\n  <nav>\n    <a href="tentang.html">Tentang</a>\n    <a href="mulai.html">Mulai</a>\n    <a href="keluar.html">Keluar</a>\n  </nav>\n</div>`,
                            simulationType: "html"
                        },
                        {

                            code: `<!DOCTYPE html>\n<html>\n<head>\n    <title>Contoh Tabel HTML</title>\n</head>\n<body>\n    <table border="1" cellpadding="5" cellspacing="0">\n        <tr>\n            <th>NIM</th>\n            <th>Nama</th>\n        </tr>\n        <tr>\n            <td>251091700200</td>\n            <td>Herlian Dwi Prianka</td>\n        </tr>\n    </table>\n<\/body>\n</html>`,
                            simulationType: "html"
                        },
                        {
                            id: 3,
                            title: "Pertemuan 3: PHP Dasar & Variabel",
                            desc: "Pengenalan PHP (PHP Hypertext Preprocessor) sebagai bahasa server-side. Mempelajari jenis tag standar (<?php ... ?>), perintah cetak (echo), deklarasi variabel dengan tanda ($), tipe data dasar, konstanta (define), dan komentar.",
                            code: `<?php\n// Mendefinisikan konstanta dan variabel\ndefine("INSTANSI", "Universitas Pamulang Serang");\n$nim = "251091700200";\n$nama = "Herlian Dwi Prianka";\n\necho "Instansi: " . INSTANSI . "<br>";\necho "NIM: $nim<br>";\necho "Nama: $nama<br>";\n?>`,
                            simulationType: "php"

                        {

                            code: `<?php\n$sisi = 15;\n$teks1 = "Volume";\n$teks2 = "Kubus";\n$volume = $sisi * $sisi * $sisi;\n\necho "$teks1 $teks2 = $volume cm3";\n?>`,

                                            })}
                                        </span>
                                    </h1>
                                    <p className="text-gray-300 leading-relaxed mb-6 font-mono text-sm md:text-base">
                                        Ini adalah website interaktif rangkuman Pemrograman Java Web dari pertemuan 1 - pertemuan 21.
                                    </p>
                                    
                                    <div className="grid grid-cols-1 gap-4 border-t border-hacker-border pt-6 mt-6">
                                        <div className="rounded-lg border border-hacker-border bg-hacker-bg p-5 sm:p-6 md:p-8">
                                            <span className="mb-5 block text-center font-bold text-cyan-400 sm:text-left md:mb-6 md:text-lg">&gt; INFORMASI PEMBUAT:</span>
                                            <div className="flex min-w-0 flex-col items-center gap-5 text-center sm:flex-row sm:gap-7 sm:text-left md:gap-9">
                                                <div className="h-28 w-28 shrink-0 rounded-full border-2 border-green-400 p-1 shadow-[0_0_16px_rgba(0,255,102,0.8)] sm:h-36 sm:w-36 md:h-40 md:w-40">
                                                    <img
                                                        src="Assets/Images/Image.jpg"
                                                        alt="Foto Herlian Dwi Prianka"
                                                        className="h-full w-full rounded-full object-cover"
                                                    />
                                                </div>
                                                <div className="min-w-0">
                                                    <p className="break-words font-mono text-xl font-semibold text-white sm:text-2xl md:text-3xl">Herlian Dwi Prianka</p>
                                                    <p className="mt-2 break-words font-mono text-sm text-gray-400 sm:text-base md:text-lg">NIM: <span className="font-bold text-green-400">251091700200</span></p>
                                                    <p className="mt-1 break-words font-mono text-sm leading-relaxed text-gray-400 sm:text-base md:text-lg">Universitas Pamulang Serang (UNPAM SERANG)</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Terminal Banner Showcase */}
                                <div className="border border-hacker-border bg-hacker-card rounded-xl p-6 font-mono">
                                    <div className="flex items-center space-x-2 pb-3 border-b border-hacker-border mb-4">
                                        <div className="w-3 h-3 rounded-full bg-red-500"></div>
                                        <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                                        <div className="w-3 h-3 rounded-full bg-green-500"></div>
                                        <span className="text-xs text-gray-400 ml-2">Herlian Dwi Prianka</span>
                                    </div>
                                    <div className="relative text-sm text-gray-300" aria-label="Animasi terminal command prompt">
                                        <div className="invisible space-y-2" aria-hidden="true">
                                            {terminalOutput.map(renderTerminalLine)}
                                            <p className="text-green-400">herlian@unpam:~$ <span>█</span></p>
                                        </div>
                                        <div className="absolute inset-0 space-y-2" aria-hidden="true">
                                            {terminalOutput.slice(0, Math.max(0, Math.min(terminalOutput.length, Math.floor((terminalProgress - 4) / 5) + 1))).map(renderTerminalLine)}
                                            {terminalProgress >= terminalCompleteProgress && (
                                                <p className="text-green-400">herlian@unpam:~$ <span className="animate-pulse">█</span></p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB MATERIALS (RINGKASAN 1 - 21) */}
                        {activeTab === 'materials' && (
                            <div className="space-y-12">
                                <div data-scroll-reveal className="scroll-reveal text-center space-y-2">
                                    <h2 className="break-words text-2xl font-bold text-green-400 font-mono glow-text sm:text-3xl">ARSIP MATERI PEMROGRAMAN WEB (1 - 21)</h2>
                                    <p className="text-gray-400 font-mono text-sm">Dikelompokkan secara terstruktur untuk memudahkan proses pembelajaran komprehensif.</p>
                                </div>

                                {materialGroups.map((groupObj, groupIdx) => (
                                    <div key={groupIdx} className="space-y-6">
                                        <div data-scroll-reveal className="scroll-reveal border-l-4 border-green-500 pl-4 py-1 bg-hacker-card/50 rounded-r">
                                            <h3 className="break-words text-xl font-bold text-cyan-400 font-mono">{groupObj.group}</h3>
                                        </div>

                                        <div className="grid grid-cols-1 gap-6">
                                            {groupObj.items.map((item, itemIdx) => (
                                                <div key={item.id} data-scroll-reveal className="scroll-reveal min-w-0">
                                                    <div
                                                        className="material-card-bubble min-w-0 border border-hacker-border bg-hacker-card rounded-xl p-6 shadow-lg"
                                                        onMouseMove={(event) => {
                                                            const bounds = event.currentTarget.getBoundingClientRect();
                                                            const horizontal = (event.clientX - bounds.left) / bounds.width - 0.5;
                                                            const vertical = (event.clientY - bounds.top) / bounds.height - 0.5;
                                                            event.currentTarget.style.setProperty('--tilt-x', `${-vertical * 10}deg`);
                                                            event.currentTarget.style.setProperty('--tilt-y', `${horizontal * 10}deg`);
                                                        }}
                                                        onMouseLeave={(event) => {
                                                            event.currentTarget.style.setProperty('--tilt-x', '0deg');
                                                            event.currentTarget.style.setProperty('--tilt-y', '0deg');
                                                        }}
                                                    >
                                                    <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-3 mb-4 pb-3 border-b border-hacker-border">
                                                        <h4 className="w-full min-w-0 break-words text-lg font-bold text-green-400 font-mono flex items-start gap-2 xl:w-auto">
                                                            <span className="shrink-0 text-cyan-400">[{item.id}]</span>
                                                            <span className="min-w-0 break-words">{item.title}</span>
                                                        </h4>
                                                        <button
                                                            onClick={() => handleDownload(item.id)}
                                                            className="max-w-full break-words whitespace-normal xl:shrink-0 xl:whitespace-nowrap px-3 py-1 bg-hacker-bg border border-cyan-500 text-cyan-400 rounded text-xs font-mono hover:bg-cyan-500 hover:text-black transition flex items-center gap-1"
                                                        >
                                                            <span className="min-w-0 break-words">↓ Unduh File Materi #{item.id}</span>
                                                        </button>
                                                    </div>

                                                    <p className="break-words text-gray-300 mb-4 text-sm md:text-base leading-relaxed">
                                                        {item.desc}
                                                    </p>

                                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-4">
                                                        {/* Code Block */}
                                                        <div className="min-w-0 relative bg-black/80 rounded-lg border border-hacker-border p-4 font-mono text-xs overflow-x-auto">
                                                            <div className="flex justify-between items-center mb-2 pb-2 border-b border-gray-800">
                                                                <span className="text-gray-500">Source Code</span>
                                                                <button
                                                                    onClick={() => handleCopy(item.code, `${groupIdx}-${itemIdx}`)}
                                                                    className="shrink-0 whitespace-nowrap px-2 py-1 bg-green-500/20 text-green-400 hover:bg-green-500 hover:text-black rounded transition text-xs"
                                                                >
                                                                    {copiedIndex === `${groupIdx}-${itemIdx}` ? 'Berhasil Disalin!' : 'Salin Kode'}
                                                                </button>
                                                            </div>
                                                            <pre className="text-green-300 whitespace-pre-wrap [overflow-wrap:anywhere]">{item.code}</pre>
                                                        </div>

                                                        {/* Simulation Result Block */}
                                                        <div className="min-w-0 bg-hacker-bg rounded-lg border border-hacker-border p-4 flex flex-col">
                                                            <div className="flex justify-between items-center mb-2 pb-2 border-b border-hacker-border">
                                                                <span className="text-gray-400 font-mono text-xs">Simulasi / Preview Hasil</span>
                                                                <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                                            </div>
                                                            <div data-simulation-preview className="min-w-0 flex-grow bg-[#0f1117] border border-gray-800 rounded p-4 flex items-center justify-center text-center font-mono text-sm">
                                                                {renderSimulation(item)}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* TAB DOWNLOAD CENTER */}
                        {activeTab === 'downloads' && (
                            <div className="space-y-6">
                                <div className="border border-green-500/40 bg-hacker-card p-6 rounded-xl">
                                    <h2 className="break-words text-2xl font-bold text-green-400 font-mono mb-2">Pusat Unduhan Materi (Pertemuan 1 - 21)</h2>
                                    <p className="text-gray-300 text-sm font-mono mb-6">
                                        Anda dapat mengunduh file materi untuk setiap pertemuan satu per satu secara terpisah melalui tombol di bawah ini.
                                    </p>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                        {Array.from({ length: 21 }, (_, i) => i + 1).map((num) => (
                                            <div key={num} className="border border-hacker-border bg-hacker-bg p-4 rounded-lg flex flex-col justify-between hover:border-cyan-500 transition">
                                                <div className="mb-3">
                                                    <span className="text-xs font-mono text-green-400 block mb-1">Modul Resmi</span>
                                                    <h4 className="font-bold font-mono text-white text-sm">Pertemuan {num}</h4>
                                                    <p className="text-xs text-gray-400 mt-1">Materi & Latihan Praktikum Web</p>
                                                </div>
                                                <a
                                                    href={`Source/Mentah/${encodeURIComponent(materialFiles[num])}`}
                                                    download={materialFiles[num]}
                                                    className="w-full break-words whitespace-normal sm:whitespace-nowrap py-2 bg-green-500 text-black font-bold font-mono rounded text-xs hover:bg-green-400 transition"
                                                >
                                                    Unduh Pertemuan {num}
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* FOOTER */}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
